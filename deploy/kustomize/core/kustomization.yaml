apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vigo
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/name: vigo-core
resources:
- volume.yaml
- certificate.yaml
- deployment.yaml
- service.yaml
- servicemonitor.yaml
- httproute.yaml

images:
- name: vigo-core
  newName: ghcr.io/yuha0/vigo-core
  newTag: main
